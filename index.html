<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF-Parser</title>
    <style>
      /* Inline so it paints instantly — before the JS bundle loads — and kills
         the white flash while WebView2 cold-starts and React mounts. */
      html,
      body {
        margin: 0;
        background: #070707;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: #070707;
        color: #f2f2f2;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        opacity: 1;
        transition: opacity 240ms ease;
      }
      #splash[data-hide="true"] {
        opacity: 0;
        pointer-events: none;
      }
      #splash .logo {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
      }
      #splash .spinner {
        width: 1.75rem;
        height: 1.75rem;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.14);
        border-top-color: #f2f2f2;
        animation: splash-spin 0.7s linear infinite;
      }
      #splash .brand {
        font-family: ui-monospace, "Cascadia Code", "Segoe UI Mono", monospace;
        font-size: 0.95rem;
        letter-spacing: 0.12em;
        color: #f2f2f2;
      }
      #splash .sub {
        font-size: 0.72rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #8a8a8a;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash {
          transition: none;
        }
        #splash .spinner {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>

  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="Loading PDF-Parser">
      <img class="logo" src="/logo.svg" width="72" height="72" alt="" />
      <div class="spinner"></div>
      <div class="brand">PDF-Parser</div>
      <div class="sub">Starting up…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
