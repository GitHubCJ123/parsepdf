[package]
name = "pdf-parser"
version = "0.1.0"
description = "Local-first PDF parser desktop app"
authors = ["Jacob"]
edition = "2021"

[lib]
name = "pdf_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "load_extension"] }
sqlite-vec = "=0.1.9"
dirs = "6"
thiserror = "2"
