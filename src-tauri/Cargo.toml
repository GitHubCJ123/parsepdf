[package]
name = "pdf-parser"
version = "2.1.0"
description = "Local-first PDF parser desktop app"
authors = ["Jacob"]
edition = "2021"

[lib]
name = "pdf_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# RapidOCR inference is on by default so `pnpm tauri dev` and the release
# installer both ship the ONNX engine. The ~179 MB model files are still an
# opt-in *runtime* download (see MODELS.md); only the code path is compiled in.
# The shared `ort` runtime is already linked via `fastembed`, so enabling this
# adds no native download — just the imageproc/ndarray inference module.
# Build a lean binary without it via `--no-default-features`.
default = ["rapidocr"]
rapidocr = ["dep:imageproc", "dep:ndarray", "dep:ort"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "load_extension"] }
sqlite-vec = "=0.1.9"
dirs = "6"
dunce = "1"
thiserror = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
anyhow = "1.0.102"
async-trait = "0.1.89"
image = "0.25"
imageproc = { version = "0.25", optional = true }
lopdf = "0.34"
quick-xml = "0.36"
sha2 = "0.10"
tempfile = "3.27.0"
num_cpus = "1.17.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-plugin-shell = "2.3.2"
tokio = { version = "1", features = ["full"] }
pdfium-render = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
fastembed = { version = "5.14", default-features = false, features = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"] }
tokio-stream = "0.1"
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = ["std", "ndarray", "tracing", "api-24"] }
tauri-plugin-stronghold = "2"
argon2 = "0.5"
rand = "0.9"
regex = "1"
notify = "6"
notify-debouncer-full = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation"] }
iota_stronghold = "2.1.0"
tauri-plugin-opener = "2.5.4"
tracing-appender = "0.2.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"
