[package]
name = "pdf-parser"
version = "0.1.0"
description = "Local-first PDF parser desktop app"
authors = ["Jacob"]
edition = "2021"

[lib]
name = "pdf_parser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.1"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31.0", features = ["bundled", "load_extension"] }
sqlite-vec = "=0.1.9"
dirs = "6"
thiserror = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
anyhow = "1.0.102"
async-trait = "0.1.89"
image = "0.25"
lopdf = "0.34"
quick-xml = "0.36"
sha2 = "0.10"
tempfile = "3.27.0"
num_cpus = "1.17.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tauri-plugin-shell = "2.3.2"
tokio = { version = "1", features = ["full"] }
pdfium-render = "0.8"
