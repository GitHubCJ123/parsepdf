<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PDF-Parser">
  <title>PDF-Parser</title>
  <defs>
    <linearGradient id="ic-tile" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#161616"/>
      <stop offset="1" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="ic-page" x1="256" y1="134" x2="256" y2="378" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fefefe"/>
      <stop offset="1" stop-color="#e6e6e6"/>
    </linearGradient>
    <linearGradient id="ic-fold" x1="298" y1="134" x2="354" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d4d4d4"/>
      <stop offset="1" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="ic-scan" x1="150" y1="227" x2="362" y2="227" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#ic-tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="113" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1.5"/>

  <path d="M176 134 L298 134 L354 190 L354 360 Q354 378 336 378 L176 378 Q158 378 158 360 L158 152 Q158 134 176 134 Z" fill="url(#ic-page)"/>

  <!-- folded corner (dog-ear) -->
  <path d="M298 134 L354 190 L298 190 Z" fill="url(#ic-fold)"/>

  <!-- text lines (raw page content) -->
  <g fill="#111111" fill-opacity="0.85">
    <rect x="186" y="168" width="104" height="12" rx="6"/>
    <rect x="186" y="196" width="140" height="12" rx="6"/>
    <rect x="186" y="278" width="138" height="12" rx="6"/>
    <rect x="186" y="306" width="96" height="12" rx="6"/>
  </g>

  <!-- extracted line (the parsed result) -->
  <rect x="186" y="250" width="120" height="12" rx="6" fill="url(#ic-scan)"/>

  <!-- scan beam (soft halo as a low-opacity band, no blur filter) -->
  <rect x="150" y="221" width="212" height="12" rx="6" fill="url(#ic-scan)" opacity="0.22"/>
  <rect x="150" y="225" width="212" height="4" rx="2" fill="url(#ic-scan)"/>
  <circle cx="150" cy="227" r="6" fill="#38bdf8"/>
  <circle cx="362" cy="227" r="6" fill="#3b82f6"/>
</svg>
